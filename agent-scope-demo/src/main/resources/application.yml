spring:
  profiles:
    active: local

server:
  port: 8081

# JWT 认证配置
jwt:
  # HS256 签名密钥（Base64 编码，至少 32 字节），生产环境请通过环境变量注入
  secret: bW9saS1hZ2VudC1zY29wZS1qd3Qtc2VjcmV0LWtleS0yMDI2LWF1dGg=
  # token 有效期（秒），默认 24 小时
  expire-seconds: 86400
  # token 请求头名称
  header: Authorization
  # token 前缀
  prefix: "Bearer "

# 流式对话（SSE）相关配置
agent:
  stream:
    # 事件空闲超时（秒）：超过该时长模型/工具没有任何事件产出时主动断流并下发 ERROR 事件，
    # 避免前端连接一直挂着、界面卡在 loading。若常用工具执行耗时较长，可调大此值
    idle-timeout-seconds: 300

  # 对话产物：字节落对象存储（或本地目录），台账落 MySQL 的 m_chat_artifact
  artifact:
    # 默认 oss：产物只存在于当前实例盘上的话，多副本/重启后下载就断了，所以生产口径直接当默认。
    # 本地想用目录：设环境变量 AGENT_ARTIFACT_STORAGE=local（或在 application-local.yml 里覆盖本项）。
    storage: ${AGENT_ARTIFACT_STORAGE:oss}
    # 单个产物上限（MB）：deliver_artifact 是将整个文件读成 byte[] 再交接的，超限直接拒绝交付
    max-size-mb: 50
    local:
      # 本地产物根目录，m_chat_artifact.object_key 相对它解析。存量 ./output 里的旧产物不搬迁，
      # 新链路的台账只记自己写出去的文件，旧目录留着仅供人工查阅
      root: ./output
    oss:
      # 只在 storage=oss 时才会被读取；四项缺任意一项即启动失败（见 OssArtifactStorage 构造校验）
      endpoint: ${OSS_ENDPOINT:}
      bucket: ${OSS_BUCKET:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      # key 前缀，不写进 object_key（表里存的是不带前缀的逻辑 key）；用于同一 bucket 内隔离与按前缀配生命周期规则
      key-prefix: artifacts/

# AgentScope 会话状态 MySQL 持久化（agentscope-extensions-mysql）
agentscope:
  state-store:
    # 状态表所在库名；留空则自动使用数据源当前库（推荐留空，避免落到默认的 agentscope 库）
    database:
    # 会话状态表名（启动时按需自动创建）
    table: agentscope_sessions
    # 是否在启动时自动建表
    auto-create-table: true